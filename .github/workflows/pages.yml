name: Deploy plugins to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # 插件分别发布到 /overview/ 和 /flow/,vite 的 base: './' 保证子路径下资源正常加载
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r milestone-overview/dist site/overview
          cp -r dependency-flow/dist site/flow
          printf '<!doctype html><meta charset="utf-8"><title>Base plugins</title><ul><li><a href="overview/">里程碑总览(整体进度 + 下一个里程碑)</a></li><li><a href="flow/">依赖关系流程图</a></li></ul>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
